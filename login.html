<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blood Donor · Login</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="auth-container">
    <h1>🩸 Blood Donor</h1>
    <h2>Welcome back</h2>

    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrapper">
          <input type="password" id="password" placeholder="Enter your password" required minlength="6">
          <span class="toggle-password" onclick="togglePassword('password', this)">👁️</span>
        </div>
      </div>

      <div class="form-options">
        <label class="remember">
          <input type="checkbox" id="remember"> Remember me
        </label>
        <a href="#" id="forgotLink" class="forgot">Forgot password?</a>
      </div>

      <button type="submit" class="btn-primary">Log In</button>
      <p id="loginMessage" class="message"></p>
    </form>

    <p class="switch-auth">Don't have an account? <a href="signup.html">Sign up</a></p>
    <p class="switch-auth" style="margin-top: 10px;"><a href="index.html">← Back to Home</a></p>
  </div>

  <script src="script.js"></script>
</body>
</html>
