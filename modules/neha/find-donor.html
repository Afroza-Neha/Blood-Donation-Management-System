<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find Blood Donor</title>
    <link rel="stylesheet" href="find-donor.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <div class="brand-title">Blood Donation Management System</div>
        <nav class="nav-links">
            <a href="find-donor.html" class="nav-btn active">Find Donor</a>
            <a href="become-donor.html" class="nav-btn">Become a Donor</a>
            <a href="request-blood.html" class="nav-btn">Request Blood</a>
            <a href="index.html" class="nav-btn">Go to Home</a>
        </nav>
    </div>
</header>

<div class="form-container">
    <h2>Find a Donor</h2>
    <form id="findDonorForm" onsubmit="return validateFindDonorForm(event)" onreset="resetFindDonorForm()">
        <fieldset>
            <div class="form-section">
                <div class="form-group">
                    <label for="bloodGroupFilter">Blood Group:</label>
                    <select id="bloodGroupFilter">
                        <option value="">All Blood Groups</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                    <span id="bloodGroupError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="districtFilter">District / City:</label>
                    <input type="text" id="districtFilter" placeholder="e.g:Dhaka">
                    <span id="districtError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="locationFilter">Location / Area:</label>
                    <input type="text" id="locationFilter" placeholder="Type Area">
                    <span id="locationError" class="error-message"></span>
                </div>
                <div class="checkbox-group full-span">
                    <input type="checkbox" id="availableNow">
                    <label for="availableNow">Available Now</label>
                    <span id="availabilityError" class="error-message"></span>
                </div>
            </div>
            
            <div class="button-row">
                <button type="submit">Search Donor</button>
                <button type="reset">Reset</button>
            </div>
            <div class="contact-hotline">
            <a href="tel:+16267">Contact with us: +16267 (24/7 Hotline)</a>
            </div>
        </fieldset>
    </form>
    <div id="donorResults">
        <div id="noDonorMessage" class="no-donor-message"></div>
        <div id="donorCardsContainer" class="donor-cards-container"></div>
    </div>
</div>
<script src="find-donor.js"></script>
</body>
</html>
