<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Blood</title>
    <link rel="stylesheet" href="request-blood.css">
</head>
<body>
<header class="site-header">
    <div class="header-inner">
        <div class="brand-title">Blood Donation Management System</div>
        <nav class="nav-links">
            <a href="find-donor.html" class="nav-btn">Find Donor</a>
            <a href="become-donor.html" class="nav-btn">Become a Donor</a>
            <a href="request-blood.html" class="nav-btn active">Request Blood</a>
            <a href="index.html" class="nav-btn">Go to Home</a>
        </nav>
    </div>
</header>

<div class="form-container">
    <h2>Request Blood</h2>
    <form id="requestBloodForm" onsubmit="return validateRequestBloodForm(event)" onreset="resetRequestBloodForm()">
        <div class="form-section">
            <div class="form-group">
                <label for="patientName">Patient Name:</label>
                <input type="text" id="patientName" placeholder="">
                <span id="patientNameError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="patientAge">Patient Age:</label>
                <input type="number" id="patientAge" min="1" max="120">
                <span id="patientAgeError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="patientBloodGroup">Patient Blood Group:</label>
                <select id="patientBloodGroup">
                    <option value="">Select Patient Blood Group</option>
                    <option value="Unknown">Unknown</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <span id="patientBloodGroupError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="requiredBloodGroup">Required Blood Group:</label>
                <select id="requiredBloodGroup">
                    <option value="">Select Required Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                </select>
                <span id="requiredBloodGroupError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="unitsNeeded">Units / Bags Needed:</label>
                <input type="number" id="unitsNeeded" min="1" max="10">
                <span id="unitsError" class="error-message"></span>
            </div>
            <div class="form-group full-span">
                <label>Select Blood Component:</label>
                <div class="inline-options">
                    <div class="checkbox-group">
                        <input type="radio" name="bloodComponent" value="Whole Blood" id="comp1">
                        <label for="comp1">Whole Blood</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" name="bloodComponent" value="Red Blood Cells" id="comp2">
                        <label for="comp2">Red Blood Cells</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" name="bloodComponent" value="Platelets" id="comp3">
                        <label for="comp3">Platelets</label>
                    </div>
                    <div class="checkbox-group">
                        <input type="radio" name="bloodComponent" value="Plasma" id="comp4">
                        <label for="comp4">Plasma</label>
                    </div>
                </div>
                <span id="componentError" class="error-message"></span>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label for="hospitalName">Hospital Name:</label>
                <input type="text" id="hospitalName">
                <span id="hospitalNameError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="hospitalLocation">Hospital Location / Area:</label>
                <input type="text" id="hospitalLocation">
                <span id="hospitalLocationError" class="error-message"></span>
            </div>
            <div class="form-group full-span">
                <label for="hospitalAddress">Hospital Full Address:</label>
                <input type="text" id="hospitalAddress">
                <span id="hospitalAddressError" class="error-message"></span>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label for="requiredDate">Required Date:</label>
                <input type="date" id="requiredDate">
                <span id="requiredDateError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="requiredTime">Required Time:</label>
                <input type="time" id="requiredTime">
                <span id="requiredTimeError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="urgencyLevel">Urgency Level:</label>
                <select id="urgencyLevel">
                    <option value="">Select Urgency Level</option>
                    <option value="Normal">Normal</option>
                    <option value="Urgent">Urgent</option>
                    <option value="Emergency">Emergency</option>
                </select>
                <span id="urgencyError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="reason">Reason / Disease:</label>
                <select id="reason">
                    <option value="">Select Reason</option>
                    <option value="Surgery">Surgery</option>
                    <option value="Dengue">Dengue</option>
                    <option value="Accident">Accident</option>
                    <option value="Thalassemia">Thalassemia</option>
                    <option value="Other">Other</option>
                </select>
                <span id="reasonError" class="error-message"></span>
            </div>
        </div>

        <div class="form-section">
            <div class="form-group">
                <label for="contactName">Contact Person Name:</label>
                <input type="text" id="contactName">
                <span id="contactNameError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="relationship">Relationship with Patient:</label>
                <input type="text" id="relationship">
                <span id="relationshipError" class="error-message"></span>
            </div>
            <div class="form-group">
                <label for="contactPhone">Contact Phone Number:</label>
                <input type="tel" id="contactPhone">
                <span id="contactPhoneError" class="error-message"></span>
            </div>
            <div class="checkbox-group full-span">
                <input type="checkbox" id="terms">
                <label for="terms">I accept the terms and conditions</label>
                <span id="termsError" class="error-message"></span>
            </div>
        </div>

        <div class="button-row">
            <button type="submit">Submit Blood Request</button>
            <button type="reset">Reset Form</button>
        </div>
        <div class="contact-hotline">
            <a href="tel:+16267">Contact with us: +16267 (24/7 Hotline)</a>
        </div>

        <div id="requestSuccess" class="success-message"></div>
        <div id="requestError" class="error-message"></div>
        <div id="requestStatusBox" class="request-status-box"></div>
    </form>
</div>
<script src="request-blood.js"></script>
</body>
</html>
